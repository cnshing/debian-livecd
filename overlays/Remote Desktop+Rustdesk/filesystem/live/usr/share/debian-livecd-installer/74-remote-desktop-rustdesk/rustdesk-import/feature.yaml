label: Use this live session's RustDesk configuration
description: |
  This feature, if enabled, will apply all of the live session RustDesk's settings onto the installed system, including its identity and permanent password. Uses the default settings when no live session is present.
requires:
  - 74-remote-desktop-rustdesk/rustdesk-app
requiresError: |
  You have selected to use the live session's RustDesk configuration without installing RustDesk. Please enable installing RustDesk or deselect this option, and try again.
import:
  - ~/.config/rustdesk # The live user's rustdesk configuration
  - /root/.config/rustdesk # The system rustdesk service's configuration
