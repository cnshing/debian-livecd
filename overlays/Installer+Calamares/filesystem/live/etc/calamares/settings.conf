# Calamares' settings for this image, designed to match preseed.cfg as well as the "Select optional features" page
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  # The "Select optional features" page
  - id: features
    module: packagechooserq
    config: features.conf
  # Removes the optional features that were not selected
  - id: features-remove
    module: shellprocess
    config: features-remove.conf
  # Copies what the selected features import from the live session, then runs the overlays' post-install and
  # user-post-install hooks
  - id: post-install-hooks
    module: shellprocess
    config: post-install-hooks.conf
  # Drops the live medium's package pool from APT's sources
  - id: live-medium-source
    module: shellprocess
    config: live-medium-source.conf

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - packagechooserq@features # Right before partitioning, as in Debian Installer
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - shellprocess@features-remove # Right after the live system is copied, as in Debian Installer
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - shellprocess@post-install-hooks 
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - shellprocess@live-medium-source
  - sources-media-unmount
  # Leave out overwriting the sources file and defer to live-build's sources. 
  - umount
- show:
  - finished

branding: debian
prompt-install: false
dont-chroot: false
