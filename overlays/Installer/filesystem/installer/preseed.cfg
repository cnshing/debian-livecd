# Helper configuration to make debian-installer more friendly for less experienced users.

# Always ensure sudo is enabled and configured regardless of whether the root password was empty during user-setup.
d-i passwd/user-default-groups string audio cdrom dip floppy video plugdev netdev scanner bluetooth debian-tor lpadmin sudo
# Ensure "Automated install" boot entry still requests a preseed URL
d-i auto-install/cloak_initrd_preseed boolean true
# Ensure GRUB also finds other future operating systems installed at a later time 
d-i grub-installer/enable_os_prober_otheros_yes boolean true
d-i grub-installer/enable_os_prober_otheros_no boolean true
# Always use a network mirror as less experienced users do not use their CD-ROMs as an apt repository
d-i apt-setup/disable-cdrom-entries boolean true
# Do not offer more media scans because it is a single disk image
d-i apt-setup/cdrom/set-first boolean false
# Load missing firmware without prompting
d-i hw-detect/load_firmware boolean true
# Allow non-free and contrib
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
