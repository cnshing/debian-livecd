distribution: trixie
lb:
  aptRecommends: true
  aptOptions: "-y -o APT::Default-Release=trixie" # NOTE: Default release should be the same as distribution
  win32Loader: false # win32-loader not supported on trixie distributions 
  bootappendLive: boot=live components username=live locales=en_US.UTF-8 keyboard-layouts=us copy-live-medium-files=RustDesk.toml,RustDesk2.toml # copy-live-medium-files: files copied off the boot drive's root before toram, for RustDesk's /run/live/medium/ configPaths
overlays:
  Networking: {}
  Networking+VPN: {}
  Desktop Environment: {}
  Desktop Environment+Shell: {}
  Desktop Environment+Tweaks: {}
  Desktop Environment+Phone Sync: {}
  Desktop Environment+Window Tiling: {}
  Desktop Environment+Theming:
    whitesur: # See overlays/Desktop Environment+Theming/config.yaml for documentation
      monterey: true
      scheme: nord
      opacity: solid
      macWindowButtons: false
  Desktop Environment+Thumbnailers: {}
  Desktop Environment+Image Viewer: {}
  Terminal: {}
  Display Manager: {}
  Text Editor: {}
  Video Player: {}
  Audio Effects: {}
  Remote Desktop: {}
  Flatpaks:
    packages:
      - com.parsecgaming.parsec
      - it.mijorus.gearlever # AppImages
  AppImages:
    appImageHomeDir: AppImages
  Remote Desktop+Rustdesk:
    configPaths:
      RustDeskToml: /run/live/medium/RustDesk.toml # Configure RustDesk at the live medium directory
      RustDesk2Toml: /run/live/medium/RustDesk2.toml
  Browser:
    ungoogled-chromium:
      installWebStore: true
  Browser+Ad blocking:
    extensions:
      google-chrome:
        - id: ddkjiahejlhfcafbddmgiahcphecmpfh
          name: uBlock Origin Lite
  Browser+Password Management:
    extensions:
      firefox:
        - id: "{446900e4-71c2-419f-a6a7-df9c091e268b}"
          name: Bitwarden
        - id: "78272b6fa58f4a1abaac99321d503a20@proton.me"
          name: Proton Pass
      google-chrome:
        - id: nngceckbapebfimnlniiiahkandclblb
          name: Bitwarden
        - id: ghmbeldphafepmbegfdlkpapadhbakde
          name: Proton Pass
      ungoogled-chromium:
        - id: nngceckbapebfimnlniiiahkandclblb
          name: Bitwarden
        - id: ghmbeldphafepmbegfdlkpapadhbakde
          name: Proton Pass